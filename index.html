<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow - Productivity App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>FocusFlow</h1>
            <p>Your minimalist workspace for productivity</p>
        </header>

        <div class="app-grid">
           
            <section class="card timer-card">
                <h2>⏱️ Focus Timer</h2>
                <div class="timer-display" id="timer">25:00</div>

              
                <div class="timer-settings">
                    <label for="focusTime">Focus Time:</label>
                    <select id="focusTime">
                        <option value="5">5 minutes</option>
                        <option value="10">10 minutes</option>
                        <option value="15">15 minutes</option>
                        <option value="20">20 minutes</option>
                        <option value="25" selected>25 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="45">45 minutes</option>
                        <option value="50">50 minutes</option>
                        <option value="60">60 minutes (1 hr)</option>
                        <option value="90">90 minutes (1.5 hrs)</option>
                        <option value="120">120 minutes (2 hrs)</option>
                    </select>
                </div>

                <div class="timer-controls">
                    <button id="start-timer" class="btn primary">Start</button>
                    <button id="pause-timer" class="btn secondary">Pause</button>
                    <button id="reset-timer" class="btn secondary">Reset</button>
                </div>
            </section>

            
            <section class="card tasks-card">
                <h2>📝 Today's Tasks</h2>
                <div class="task-input-group">
                    <input type="text" id="task-input" placeholder="What needs to be done?">
                    <button id="add-task" class="btn primary">Add</button>
                </div>
                <ul id="task-list" class="task-list">
                  
                </ul>
            </section>

           
            <section class="card notes-card">
                <h2>💡 Quick Notes</h2>
                <textarea id="quick-notes" placeholder="Jot down quick thoughts, links, or ideas..."></textarea>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
