<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>FocusFlow</h1>
      <p class="tagline">Stay organized, stay focused.</p>
    </header>

    <main class="main-content">
    
      <section class="card timer-card">
        <h2>⏱️ Focus Session</h2>
        <div class="timer-display" id="timerDisplay">25:00</div>
        <p id="timerStatus" class="timer-status">Ready when you are.</p>

        
        <div class="timer-settings">
          <label for="focusTime">Focus Time:</label>
          <select id="focusTime">
            <option value="10">10 minutes</option>
            <option value="15">15 minutes</option>
            <option value="25" selected>25 minutes</option>
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60">60 minutes</option>
          </select>
        </div>

        <div class="timer-actions">
          <button id="startTimer" class="btn primary-btn">▶ Start</button>
          <button id="pauseTimer" class="btn secondary-btn">⏸ Pause</button>
          <button id="resetTimer" class="btn secondary-btn">↻ Reset</button>
        </div>
      </section>

      
      <section class="card task-card">
        <h2>📝 Tasks</h2>
        <form id="taskForm" class="task-form">
          <input type="text" id="taskInput" placeholder="Add a new task..." required />
          <button type="submit" class="btn primary-btn">Add Task</button>
        </form>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
